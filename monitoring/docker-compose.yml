version: '3.8'

services:
  # ─── 1. PROMETHEUS (Metrics Collector) ───
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  # ─── 2. LOKI (Log Collector) ───
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
    restart: unless-stopped

  # ─── 3. GRAFANA (Dashboard) ───
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in monitoring/.env (copy monitoring/.env.example)}
    volumes:
      - ./grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # ─── 4. REDIS (shared rate-limit store) ───
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in monitoring/.env (copy monitoring/.env.example)}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data: